<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひづけメモ</title>
<meta name="description" content="日付つきのひとことメモと買うものメモ">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひづけメモ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Kiwi+Maru:wght@400;500&family=Yomogi&family=Hachi+Maru+Pop&display=swap">
<style>
/* Layout: a pocket-diary app. Each tab has a sticky input bar on top; a tab bar sits at the bottom within thumb reach. */
:root {
  --accent-base: #2f55d4;          /* set from 着せかえ */
  --veil: 0.55;                    /* how much the page colour covers a background photo */
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;

  --paper: #f3f5f8;
  --sheet: #ffffff;
  --ink: #1d2433;
  --ink-soft: #5b6476;
  --rule: #dfe3ea;
  --today: #d4472f;
  --today-soft: #fde8e3;
  --accent: var(--accent-base);
  --on-accent: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--sheet));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151c; --sheet: #1b1f29; --ink: #e8ebf2; --ink-soft: #9aa3b5; --rule: #2b3140;
    --today: #ff8a73; --today-soft: #3a2420;
    --accent: color-mix(in srgb, var(--accent-base) 62%, #ffffff);
    --on-accent: #12151c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #1b1f29; --ink: #e8ebf2; --ink-soft: #9aa3b5; --rule: #2b3140;
  --today: #ff8a73; --today-soft: #3a2420;
  --accent: color-mix(in srgb, var(--accent-base) 62%, #ffffff);
  --on-accent: #12151c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input { font-family: inherit; }

/* ---- background photo ---- */
#bg { position: fixed; inset: 0; z-index: -1; background: var(--paper) center / cover no-repeat; }
#bg::after { content: ""; position: absolute; inset: 0; background: var(--paper); opacity: 0; }
body.has-bg #bg::after { opacity: var(--veil); }

body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper);
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}

/* ---- top bar ---- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--paper);
  padding-block: 16px 12px;
  display: grid;
  gap: 8px;
}
body.has-bg .bar, body.has-bg::before {
  background: color-mix(in srgb, var(--paper) 78%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
body.has-bg .bar { margin-inline: -16px; padding-inline: 16px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 0.04em; }
.brand .sub { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
form.entry {
  display: flex; gap: 8px; align-items: stretch;
  background: var(--sheet);
  border: 1.5px solid var(--rule);
  border-radius: 16px;
  padding: 6px 6px 6px 14px;
  transition: border-color .15s;
}
form.entry:focus-within { border-color: var(--accent); }
form.entry input {
  flex: 1; min-width: 0;
  border: 0; outline: 0; background: transparent; color: var(--ink);
  font-size: 16px; padding-block: 8px;
}
form.entry input::placeholder { color: var(--ink-soft); opacity: .8; }
.add-btn {
  border: 0; border-radius: 12px; padding: 0 16px;
  background: var(--accent); color: var(--on-accent);
  font-weight: 700; font-size: 14px; cursor: pointer;
}
.add-btn.is-empty { opacity: .35; }
button:focus-visible, summary:focus-visible, label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.preview {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 13px; color: var(--ink-soft); min-height: 26px;
}
.preview .when {
  font-variant-numeric: tabular-nums;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 1px 10px; font-size: 12.5px; font-weight: 700;
}
.preview .when.auto { background: transparent; border: 1px dashed var(--rule); color: var(--ink-soft); font-weight: 400; }
.preview label { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
.preview input[type=date] { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

/* ---- lists ---- */
.group { margin-top: 20px; }
.group h2 {
  margin: 0 0 6px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 8px;
}
.group h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
body.has-bg .group h2 { color: var(--ink); }
.group.is-today h2 { color: var(--today); }
ul.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
li.item {
  position: relative;
  display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
  background: var(--sheet); border-radius: 14px; padding: 10px 8px 10px 12px;
}
li.item.shop { grid-template-columns: auto 1fr auto; gap: 10px; padding-left: 8px; }
li.item .open {
  position: absolute; inset: 0; width: 100%; border: 0; background: transparent;
  border-radius: 14px; cursor: pointer; padding: 0;
}
li.item .open:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
li.item .stamp, li.item .text { pointer-events: none; position: relative; }
li.item .del, li.item .check { position: relative; z-index: 1; }
.stamp { display: grid; justify-items: start; line-height: 1.2; }
.stamp .md { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stamp .rel { font-size: 11px; color: var(--ink-soft); }
.is-today .stamp .rel { color: var(--today); font-weight: 700; }
.text { min-width: 0; overflow-wrap: anywhere; }
.del {
  border: 0; background: transparent; color: var(--ink-soft);
  width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
}
.del:hover { background: var(--today-soft); color: var(--today); }
.check {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--rule); background: transparent; cursor: pointer;
  display: grid; place-items: center; padding: 0; color: var(--on-accent);
}
.check svg { width: 16px; height: 16px; opacity: 0; }
li.done .check { background: var(--accent); border-color: var(--accent); }
li.done .check svg { opacity: 1; }
li.done .text { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-soft) 60%, transparent); }
li.done { opacity: .75; }

li.item.editing { display: block; padding: 10px; outline: 1.5px solid var(--accent); }
.editor { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; }
.editor.noDate { grid-template-columns: 1fr; }
.editor input {
  color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 10px; padding: 6px 8px; min-width: 0; font-size: 16px;
}
.editor input[type=date] { font-size: 14px; }
.editor input:focus { outline: 0; border-color: var(--accent); }
.editor-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
.editor-actions .add-btn { padding: 6px 16px; }
.ghost {
  border: 0; background: transparent; color: var(--ink-soft); font-size: 14px;
  padding: 6px 12px; border-radius: 10px; cursor: pointer;
}
.ghost:hover { background: var(--rule); }
@media (max-width: 380px) { .editor { grid-template-columns: 1fr; } }

details.past { margin-top: 28px; }
details.past summary { cursor: pointer; list-style: none; font-size: 13px; color: var(--ink-soft); padding: 6px 0; }
body.has-bg details.past summary { color: var(--ink); }
details.past summary::-webkit-details-marker { display: none; }
details.past summary::before { content: "▸ "; }
details.past[open] summary::before { content: "▾ "; }
details.past li.item { opacity: .6; }

.clear-done {
  margin-top: 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-soft);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
}
.clear-done:hover { color: var(--today); border-color: var(--today); }

/* ---- empty states ---- */
.empty {
  margin-top: 28px; padding: 22px 18px; border: 1.5px dashed var(--rule); border-radius: 16px;
  display: grid; gap: 12px; background: color-mix(in srgb, var(--sheet) 60%, transparent);
}
.empty p { margin: 0; }
.empty .lead { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.howto { font-size: 12.5px; color: var(--ink-soft); }
.status { margin-top: 32px; font-size: 11.5px; color: var(--ink-soft); text-align: center; }

/* ---- 着せかえ ---- */
.panel { display: grid; gap: 24px; margin-top: 12px; }
.card {
  background: var(--sheet); border-radius: 16px; padding: 16px;
  display: grid; gap: 12px;
}
.card h2 { margin: 0; font-size: 14px; font-weight: 700; }
.card .hint { margin: -6px 0 0; font-size: 12px; color: var(--ink-soft); }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch {
  width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: var(--c); box-shadow: 0 0 0 2px var(--sheet), 0 0 0 2px transparent;
  transition: box-shadow .15s;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sheet), 0 0 0 5px var(--ink); }
.swatch.custom {
  position: relative; overflow: hidden;
  background: conic-gradient(#e05a8a, #e8833a, #e3c23c, #2a9d7f, #2f55d4, #7b5cd6, #e05a8a);
  display: grid; place-items: center;
}
.swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatch.custom span { width: 18px; height: 18px; border-radius: 50%; background: var(--sheet); display: block; pointer-events: none; }
.swatch.custom[aria-pressed="true"] span { background: var(--accent-base); border: 3px solid var(--sheet); width: 22px; height: 22px; }

.fonts { display: grid; gap: 8px; }
.font-opt {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center;
  border: 1.5px solid var(--rule); border-radius: 14px; padding: 10px 14px; cursor: pointer;
}
.font-opt input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; grid-row: span 2; }
.font-opt .name { font-size: 12px; color: var(--ink-soft); font-family: var(--font-body); }
.font-opt .sample { font-size: 17px; line-height: 1.4; }
.font-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

.bg-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.bg-thumb {
  width: 72px; height: 104px; border-radius: 12px; flex: none;
  background: var(--paper) center / cover no-repeat; border: 1.5px solid var(--rule);
  display: grid; place-items: center; font-size: 12px; color: var(--ink-soft);
}
.bg-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center;
}
.pill.solid { background: var(--accent); color: var(--on-accent); }
.pill.quiet { border-color: var(--rule); color: var(--ink-soft); font-weight: 400; }
.pill input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.range-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-size: 13px; color: var(--ink-soft); }
.range-row input { accent-color: var(--accent); width: 100%; }
.range-row output { font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
.reset-row { display: flex; justify-content: center; }

/* ---- bottom tabs ---- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: color-mix(in srgb, var(--sheet) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--rule);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button {
  border: 0; background: transparent; color: var(--ink-soft); cursor: pointer;
  display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 11.5px; font-weight: 700;
}
nav.tabs svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

/* ---- toast ---- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 9;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper);
  border-radius: 14px; padding: 10px 10px 10px 16px;
  display: flex; gap: 14px; align-items: center; font-size: 14px;
  max-width: calc(100% - 32px); white-space: nowrap;
}
.toast button { border: 0; background: transparent; color: var(--accent-soft); font-weight: 700; cursor: pointer; padding: 4px 8px; }
@media (prefers-reduced-motion: no-preference) {
  li.item.fresh { animation: pop .35s ease-out; }
  @keyframes pop { from { background: var(--accent-soft); } to { background: var(--sheet); } }
}
</style>
</head>
<body>
<div id="bg"></div>

<div class="wrap">
  <!-- 日付メモ -->
  <section id="tab-dates">
    <div class="bar">
      <div class="brand">
        <h1>ひづけメモ</h1>
        <span class="sub" id="todayline"></span>
      </div>
      <form class="entry" id="entry" autocomplete="off">
        <input id="memo-input" type="text" enterkeyhint="done" placeholder="明日 グッズ締切" aria-label="日付メモを入力">
        <button class="add-btn is-empty" id="add-btn" type="button">追加</button>
      </form>
      <div class="preview" id="preview" aria-live="polite"></div>
    </div>
    <main id="list"></main>
    <p class="status">メモをタップすると書き直せます ・ このスマホの中に保存しています</p>
  </section>

  <!-- 買うものメモ -->
  <section id="tab-shop" hidden>
    <div class="bar">
      <div class="brand">
        <h1>買うもの</h1>
        <span class="sub" id="shop-count"></span>
      </div>
      <form class="entry" id="shop-entry" autocomplete="off">
        <input id="shop-input" type="text" enterkeyhint="done" placeholder="牛乳" aria-label="買うものを入力">
        <button class="add-btn is-empty" id="shop-add" type="button">追加</button>
      </form>
    </div>
    <main id="shop-list"></main>
  </section>

  <!-- 着せかえ -->
  <section id="tab-style" hidden>
    <div class="bar">
      <div class="brand"><h1>着せかえ</h1></div>
    </div>
    <div class="panel">
      <div class="card">
        <h2>テーマの色</h2>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="card">
        <h2>フォント</h2>
        <div class="fonts" id="fonts"></div>
      </div>

      <div class="card">
        <h2>背景</h2>
        <p class="hint">好きな画像を背景にできます。画像はこのスマホの中にだけ保存されます。</p>
        <div class="bg-row">
          <div class="bg-thumb" id="bg-thumb">なし</div>
          <div class="bg-actions">
            <label class="pill solid" for="bg-file">画像をえらぶ<input id="bg-file" type="file" accept="image/*"></label>
            <button class="pill quiet" id="bg-clear" type="button" hidden>外す</button>
          </div>
        </div>
        <div class="range-row" id="veil-row" hidden>
          <label for="veil">背景のうすさ</label>
          <input id="veil" type="range" min="0" max="0.9" step="0.05">
          <output id="veil-out" for="veil"></output>
        </div>
      </div>

      <div class="reset-row">
        <button class="pill quiet" id="reset-style" type="button">最初の見た目に戻す</button>
      </div>
    </div>
  </section>
</div>

<nav class="tabs" aria-label="切り替え">
  <div class="inner">
    <button type="button" data-tab="dates">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      日付メモ
    </button>
    <button type="button" data-tab="shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
      買うもの
    </button>
    <button type="button" data-tab="style">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.4-1.1-1.6-1.1-2.8 0-1 .8-1.6 1.8-1.6h2a4 4 0 0 0 4-4C20.5 6.7 16.7 3.5 12 3.5z"/><circle cx="7.8" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="7.6" r="1.1" fill="currentColor" stroke="none"/></svg>
      着せかえ
    </button>
  </div>
</nav>

<div class="toast" id="toast" hidden><span id="toast-msg"></span><button type="button" id="toast-undo">元に戻す</button></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  // ---------- small storage helpers ----------
  const load = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

  const K_DATES = "hizuke-memo:v1";          // same key as before, so old memos stay
  const K_SHOP = "hizuke-memo:shop:v1";
  const K_STYLE = "hizuke-memo:style:v1";

  // ---------- dates ----------
  const WD = ["日","月","火","水","木","金","土"];
  const pad = n => String(n).padStart(2, "0");
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
  const today0 = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const diffDays = (a, b) => Math.round((a - b) / 86400000);
  const valid = (y, m, d) => { const x = new Date(y, m-1, d); return x.getMonth() === m-1 && x.getDate() === d ? x : null; };

  function normalize(s) {
    return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
            .replace(/／/g, "/").replace(/　/g, " ");
  }

  function parse(raw) {
    const s = normalize(raw);
    const t = today0();
    const rules = [
      [/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?/, m => valid(+m[1], +m[2], +m[3])],
      [/(\d{1,2})[\/月](\d{1,2})日?/, m => {
        let d = valid(t.getFullYear(), +m[1], +m[2]);
        if (d && diffDays(d, t) < -60) d = valid(t.getFullYear()+1, +m[1], +m[2]);
        return d;
      }],
      [/しあさって|明々後日/, () => addDays(t, 3)],
      [/あさって|明後日/, () => addDays(t, 2)],
      [/明日|あした|あす/, () => addDays(t, 1)],
      [/今日|きょう/, () => t],
      [/昨日|きのう/, () => addDays(t, -1)],
      [/(\d+)\s*日後/, m => addDays(t, +m[1])],
      [/(\d+)\s*週間後/, m => addDays(t, 7 * +m[1])],
      [/(来週|再来週|今週)の?\s*([月火水木金土日])曜日?/, m => {
        const monday = addDays(t, -((t.getDay() + 6) % 7));
        const target = (WD.indexOf(m[2]) + 6) % 7;
        const weeks = m[1] === "今週" ? 0 : m[1] === "来週" ? 1 : 2;
        return addDays(monday, weeks * 7 + target);
      }],
      [/(?:次の)?([月火水木金土日])曜日?/, m => addDays(t, (WD.indexOf(m[1]) - t.getDay() + 7) % 7)],
      [/来週/, () => addDays(t, 7)],
      [/(?<![\d月\/])(\d{1,2})日(?!後|間)/, m => {
        const day = +m[1];
        let d = valid(t.getFullYear(), t.getMonth()+1, day);
        if (!d || d < t) { const nx = new Date(t.getFullYear(), t.getMonth()+1, day); d = nx.getDate() === day ? nx : null; }
        return d;
      }],
    ];
    for (const [re, fn] of rules) {
      const m = s.match(re);
      if (!m) continue;
      const d = fn(m);
      if (!d) continue;
      const text = (s.slice(0, m.index) + " " + s.slice(m.index + m[0].length))
        .replace(/^[\s、,：:のに]+/, "").replace(/\s+/g, " ").trim();
      return { date: d, text: text || s.trim() };
    }
    return { date: null, text: s.trim() };
  }

  function rel(d) {
    const n = diffDays(d, today0());
    if (n === 0) return "今日";
    if (n === 1) return "明日";
    if (n === 2) return "あさって";
    if (n === -1) return "昨日";
    return n > 0 ? `あと${n}日` : `${-n}日前`;
  }
  const md = d => `${d.getMonth()+1}/${d.getDate()}`;
  const mdw = d => `${md(d)}（${WD[d.getDay()]}）`;

  // ---------- toast with undo ----------
  const toast = $("toast"), toastMsg = $("toast-msg"), undoBtn = $("toast-undo");
  let toastTimer = null, undoFn = null;
  function showToast(msg, undo) {
    toastMsg.textContent = msg; undoFn = undo || null; undoBtn.hidden = !undo;
    toast.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; undoFn = null; }, 5000);
  }
  undoBtn.addEventListener("click", () => { const f = undoFn; undoFn = null; toast.hidden = true; if (f) f(); });

  // run `go` when the button is tapped or Enter is pressed in the input.
  // Works without relying on form submission, and ignores the Enter that confirms Japanese conversion.
  function onAdd(form, inputEl, button, go) {
    let composing = false;
    inputEl.addEventListener("compositionstart", () => { composing = true; });
    inputEl.addEventListener("compositionend", () => { setTimeout(() => { composing = false; }, 0); });
    inputEl.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      if (composing || e.isComposing || e.keyCode === 229) return;
      e.preventDefault(); go();
    });
    button.addEventListener("click", e => { e.preventDefault(); go(); });
    form.addEventListener("submit", e => { e.preventDefault(); go(); });
  }

  // shared inline editor (text, plus a date when given)
  function editorEl(it, withDate, onSave, onClose) {
    const li = document.createElement("li");
    li.className = "item editing";
    const form = document.createElement("form");
    form.className = "editor" + (withDate ? "" : " noDate");
    form.setAttribute("autocomplete", "off");
    let dateIn = null;
    if (withDate) {
      dateIn = document.createElement("input");
      dateIn.type = "date"; dateIn.id = "edit-date"; dateIn.value = it.date;
      dateIn.setAttribute("aria-label", "日付");
      form.append(dateIn);
    }
    const textIn = document.createElement("input");
    textIn.type = "text"; textIn.id = "edit-text"; textIn.value = it.text;
    textIn.setAttribute("aria-label", "メモ"); textIn.setAttribute("enterkeyhint", "done");
    const row = document.createElement("div"); row.className = "editor-actions";
    const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "ghost"; cancel.textContent = "やめる";
    const ok = document.createElement("button"); ok.type = "button"; ok.className = "add-btn"; ok.textContent = "保存";
    row.append(cancel, ok);
    form.append(textIn, row);
    li.append(form);
    cancel.addEventListener("click", onClose);
    form.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); onClose(); } });
    let done = false;
    onAdd(form, textIn, ok, () => {
      if (done) return;
      const text = textIn.value.trim();
      if (!text || (dateIn && !dateIn.value)) { textIn.focus(); return; }
      done = true;
      onSave(text, dateIn ? dateIn.value : null);
    });
    requestAnimationFrame(() => { textIn.focus(); const n = textIn.value.length; try { textIn.setSelectionRange(n, n); } catch {} });
    return li;
  }

  function delButton(label, onClick) {
    const del = document.createElement("button"); del.className = "del"; del.type = "button";
    del.setAttribute("aria-label", label); del.textContent = "×";
    del.addEventListener("click", onClick);
    return del;
  }
  function openButton(label, onClick) {
    const b = document.createElement("button"); b.type = "button"; b.className = "open";
    b.setAttribute("aria-label", label); b.addEventListener("click", onClick);
    return b;
  }

  // =====================================================================
  // 日付メモ
  // =====================================================================
  let items = load(K_DATES, []);
  let editingId = null;
  const writeDates = () => { if (!save(K_DATES, items)) showToast("保存できませんでした"); };
  function putDate(it) { items = [...items.filter(x => x.id !== it.id), it]; writeDates(); renderDates(it.id); }
  function dropDate(id) { items = items.filter(x => x.id !== id); writeDates(); renderDates(); }

  const input = $("memo-input"), addBtn = $("add-btn"), preview = $("preview"), list = $("list");
  let manualDate = null;
  const setTodayline = () => { $("todayline").textContent = `${today0().getFullYear()}.${mdw(today0())}`; };

  function updatePreview() {
    const v = input.value;
    addBtn.classList.toggle("is-empty", !v.trim());
    preview.textContent = "";
    if (!v.trim()) { manualDate = null; return; }
    const p = parse(v);
    const d = manualDate || p.date;
    const chip = document.createElement("span");
    chip.className = "when" + (d ? "" : " auto");
    chip.textContent = d ? `${mdw(d)} ・ ${rel(d)}` : `日付なし → 今日`;
    const lab = document.createElement("label");
    lab.htmlFor = "date-pick"; lab.textContent = "日付を変える";
    const pick = document.createElement("input");
    pick.type = "date"; pick.id = "date-pick"; pick.value = key(d || today0());
    pick.addEventListener("change", () => { if (pick.value) { manualDate = fromKey(pick.value); updatePreview(); input.focus(); } });
    lab.addEventListener("click", e => { e.preventDefault(); try { pick.showPicker(); } catch { pick.focus(); } });
    preview.append(chip, lab, pick);
  }
  input.addEventListener("input", updatePreview);

  onAdd($("entry"), input, addBtn, () => {
    const v = input.value;
    if (!v.trim()) return;
    const p = parse(v);
    const d = manualDate || p.date || today0();
    input.value = ""; manualDate = null; updatePreview(); input.focus();
    putDate({ id: newId(), text: p.text, date: key(d), created: Date.now() });
  });

  function dateItemEl(it, fresh) {
    if (it.id === editingId) {
      return editorEl(it, true, (text, date) => {
        editingId = null;
        if (text === it.text && date === it.date) { renderDates(); return; }
        putDate({ ...it, text, date }); showToast("直しました");
      }, () => { editingId = null; renderDates(); });
    }
    const d = fromKey(it.date);
    const li = document.createElement("li");
    li.className = "item" + (fresh ? " fresh" : "");
    const st = document.createElement("div"); st.className = "stamp";
    const a = document.createElement("span"); a.className = "md"; a.textContent = md(d);
    const b = document.createElement("span"); b.className = "rel"; b.textContent = `${WD[d.getDay()]}・${rel(d)}`;
    st.append(a, b);
    const tx = document.createElement("div"); tx.className = "text"; tx.textContent = it.text;
    li.append(
      openButton(`「${it.text}」を書き直す`, () => { editingId = it.id; renderDates(); }),
      st, tx,
      delButton(`「${it.text}」を消す`, () => { dropDate(it.id); showToast("消しました", () => putDate(it)); })
    );
    return li;
  }

  function group(title, arr, cls, freshId) {
    const sec = document.createElement("section"); sec.className = "group " + (cls || "");
    const h = document.createElement("h2"); h.textContent = title;
    const ul = document.createElement("ul"); ul.className = "items";
    arr.forEach(it => ul.append(dateItemEl(it, it.id === freshId)));
    sec.append(h, ul);
    return sec;
  }

  function renderDates(freshId) {
    list.textContent = "";
    const t = today0();
    const sorted = [...items].sort((x, y) => x.date === y.date ? x.created - y.created : x.date < y.date ? -1 : 1);
    if (!sorted.length) return;
    const bk = { today: [], tomorrow: [], week: [], later: [], past: [] };
    for (const it of sorted) {
      const n = diffDays(fromKey(it.date), t);
      (n < 0 ? bk.past : n === 0 ? bk.today : n === 1 ? bk.tomorrow : n <= 7 ? bk.week : bk.later).push(it);
    }
    if (bk.today.length) list.append(group("今日", bk.today, "is-today", freshId));
    if (bk.tomorrow.length) list.append(group("明日", bk.tomorrow, "", freshId));
    if (bk.week.length) list.append(group("1週間以内", bk.week, "", freshId));
    if (bk.later.length) list.append(group("もっと先", bk.later, "", freshId));
    if (!bk.today.length && !bk.tomorrow.length && !bk.week.length && !bk.later.length) {
      const p = document.createElement("p"); p.className = "howto"; p.style.marginTop = "24px";
      p.textContent = "これからの予定はありません。";
      list.append(p);
    }
    if (bk.past.length) {
      const det = document.createElement("details"); det.className = "past";
      const sum = document.createElement("summary"); sum.textContent = `過ぎたもの ${bk.past.length}件`;
      const ul = document.createElement("ul"); ul.className = "items";
      [...bk.past].reverse().forEach(it => ul.append(dateItemEl(it)));
      det.append(sum, ul);
      list.append(det);
    }
  }

  // =====================================================================
  // 買うものメモ
  // =====================================================================
  let shop = load(K_SHOP, []);
  let shopEditing = null;
  const writeShop = () => { if (!save(K_SHOP, shop)) showToast("保存できませんでした"); };
  function putShop(it, fresh) { shop = [...shop.filter(x => x.id !== it.id), it]; writeShop(); renderShop(fresh ? it.id : null); }
  function dropShop(id) { shop = shop.filter(x => x.id !== id); writeShop(); renderShop(); }

  const shopInput = $("shop-input"), shopAdd = $("shop-add"), shopList = $("shop-list");
  const syncShopBtn = () => shopAdd.classList.toggle("is-empty", !shopInput.value.trim());
  shopInput.addEventListener("input", syncShopBtn);
  onAdd($("shop-entry"), shopInput, shopAdd, () => {
    const text = normalize(shopInput.value).trim();
    if (!text) { shopInput.focus(); return; }
    shopInput.value = ""; syncShopBtn(); shopInput.focus();
    putShop({ id: newId(), text, done: false, created: Date.now(), doneAt: 0 }, true);
  });

  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  function shopItemEl(it, fresh) {
    if (it.id === shopEditing) {
      return editorEl(it, false, text => {
        shopEditing = null;
        if (text === it.text) { renderShop(); return; }
        putShop({ ...it, text }); showToast("直しました");
      }, () => { shopEditing = null; renderShop(); });
    }
    const li = document.createElement("li");
    li.className = "item shop" + (it.done ? " done" : "") + (fresh ? " fresh" : "");
    const chk = document.createElement("button");
    chk.type = "button"; chk.className = "check"; chk.innerHTML = CHECK_SVG;
    chk.setAttribute("aria-pressed", it.done ? "true" : "false");
    chk.setAttribute("aria-label", it.done ? `「${it.text}」のチェックを外す` : `「${it.text}」を買ったことにする`);
    chk.addEventListener("click", () => putShop({ ...it, done: !it.done, doneAt: it.done ? 0 : Date.now() }));
    const tx = document.createElement("div"); tx.className = "text"; tx.textContent = it.text;
    li.append(
      openButton(`「${it.text}」を書き直す`, () => { shopEditing = it.id; renderShop(); }),
      chk, tx,
      delButton(`「${it.text}」を消す`, () => { dropShop(it.id); showToast("消しました", () => putShop(it)); })
    );
    return li;
  }

  function renderShop(freshId) {
    shopList.textContent = "";
    const todo = shop.filter(x => !x.done).sort((a, b) => b.created - a.created);
    const done = shop.filter(x => x.done).sort((a, b) => b.doneAt - a.doneAt);
    $("shop-count").textContent = todo.length ? `あと${todo.length}こ` : (done.length ? "ぜんぶ買えた！" : "");
    if (!shop.length) {
      const box = document.createElement("div"); box.className = "empty";
      const p1 = document.createElement("p"); p1.className = "lead"; p1.textContent = "思いついたら、すぐ入れておこう。";
      const p2 = document.createElement("p"); p2.className = "howto";
      p2.textContent = "買ったら左の丸をタップ。チェックしたものは下にまとまります。文字をタップすると書き直せます。";
      box.append(p1, p2);
      shopList.append(box);
      return;
    }
    if (todo.length) {
      const sec = document.createElement("section"); sec.className = "group";
      const h = document.createElement("h2"); h.textContent = "買うもの";
      const ul = document.createElement("ul"); ul.className = "items";
      todo.forEach(it => ul.append(shopItemEl(it, it.id === freshId)));
      sec.append(h, ul); shopList.append(sec);
    }
    if (done.length) {
      const sec = document.createElement("section"); sec.className = "group";
      const h = document.createElement("h2"); h.textContent = "買ったもの";
      const ul = document.createElement("ul"); ul.className = "items";
      done.forEach(it => ul.append(shopItemEl(it)));
      const clear = document.createElement("button");
      clear.type = "button"; clear.className = "clear-done"; clear.textContent = `買ったもの ${done.length}こを消す`;
      clear.addEventListener("click", () => {
        const removed = shop.filter(x => x.done);
        shop = shop.filter(x => !x.done); writeShop(); renderShop();
        showToast(`${removed.length}こ消しました`, () => { shop = [...shop, ...removed]; writeShop(); renderShop(); });
      });
      sec.append(h, ul, clear); shopList.append(sec);
    }
  }

  // =====================================================================
  // 着せかえ
  // =====================================================================
  const COLORS = [
    ["ブルー", "#2f55d4"], ["ピンク", "#dc4f86"], ["ミント", "#1f9a7a"],
    ["パープル", "#7b5cd6"], ["オレンジ", "#e07a2c"], ["チョコ", "#7a5340"],
  ];
  const FONTS = {
    maru:   { name: "まるゴシック", stack: '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif' },
    round:  { name: "まんまる",     stack: '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif' },
    kiwi:   { name: "ふんわり",     stack: '"Kiwi Maru", "Hiragino Mincho ProN", serif' },
    yomogi: { name: "てがき",       stack: '"Yomogi", "Hiragino Maru Gothic ProN", sans-serif' },
    pop:    { name: "ポップ",       stack: '"Hachi Maru Pop", "Hiragino Maru Gothic ProN", sans-serif' },
  };
  const STYLE_DEFAULTS = { accent: "#2f55d4", font: "maru", veil: 0.55 };
  let style = { ...STYLE_DEFAULTS, ...load(K_STYLE, {}) };
  if (!FONTS[style.font]) style.font = STYLE_DEFAULTS.font;

  function applyStyle() {
    root.style.setProperty("--accent-base", style.accent);
    root.style.setProperty("--font-body", FONTS[style.font].stack);
    root.style.setProperty("--veil", String(style.veil));
  }
  const saveStyle = () => save(K_STYLE, style);

  // colour swatches
  const swatches = $("swatches");
  function renderSwatches() {
    swatches.textContent = "";
    let matched = false;
    for (const [name, c] of COLORS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "swatch"; b.style.setProperty("--c", c);
      const on = c.toLowerCase() === style.accent.toLowerCase();
      matched = matched || on;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.setAttribute("aria-label", name);
      b.addEventListener("click", () => { style.accent = c; applyStyle(); saveStyle(); renderSwatches(); });
      swatches.append(b);
    }
    const custom = document.createElement("label");
    custom.className = "swatch custom";
    custom.setAttribute("aria-pressed", matched ? "false" : "true");
    custom.title = "好きな色";
    const ci = document.createElement("input");
    ci.type = "color"; ci.id = "custom-color"; ci.value = style.accent;
    ci.setAttribute("aria-label", "好きな色をえらぶ");
    ci.addEventListener("input", () => { style.accent = ci.value; applyStyle(); });
    ci.addEventListener("change", () => { style.accent = ci.value; applyStyle(); saveStyle(); renderSwatches(); });
    const dot = document.createElement("span");
    custom.append(ci, dot);
    swatches.append(custom);
  }

  // fonts
  const fontsBox = $("fonts");
  function renderFonts() {
    fontsBox.textContent = "";
    for (const [id, f] of Object.entries(FONTS)) {
      const lab = document.createElement("label"); lab.className = "font-opt";
      const r = document.createElement("input");
      r.type = "radio"; r.name = "font"; r.id = "font-" + id; r.value = id; r.checked = style.font === id;
      r.addEventListener("change", () => { style.font = id; applyStyle(); saveStyle(); });
      const n = document.createElement("span"); n.className = "name"; n.textContent = f.name;
      const s = document.createElement("span"); s.className = "sample"; s.style.fontFamily = f.stack;
      s.textContent = "あしたは グッズの日 10/25";
      lab.append(r, n, s);
      fontsBox.append(lab);
    }
  }

  // background photo, kept in IndexedDB because photos are too big for localStorage
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const rq = indexedDB.open("hizuke-memo", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("files");
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
    },
    async get(k) {
      const db = await this.open();
      return new Promise((res, rej) => { const rq = db.transaction("files").objectStore("files").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
    },
    async set(k, v) {
      const db = await this.open();
      return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
    },
    async del(k) {
      const db = await this.open();
      return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
    },
  };

  let bgUrl = null;
  function showBg(blob) {
    if (bgUrl) { URL.revokeObjectURL(bgUrl); bgUrl = null; }
    const thumb = $("bg-thumb");
    if (blob) {
      bgUrl = URL.createObjectURL(blob);
      $("bg").style.backgroundImage = `url("${bgUrl}")`;
      thumb.style.backgroundImage = `url("${bgUrl}")`; thumb.textContent = "";
      document.body.classList.add("has-bg");
    } else {
      $("bg").style.backgroundImage = "";
      thumb.style.backgroundImage = ""; thumb.textContent = "なし";
      document.body.classList.remove("has-bg");
    }
    $("bg-clear").hidden = !blob;
    $("veil-row").hidden = !blob;
  }

  // shrink big photos so they load fast and fit in storage
  async function shrink(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1600;
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", 0.85));
    } finally { URL.revokeObjectURL(url); }
  }

  $("bg-file").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      const blob = await shrink(f);
      await idb.set("bg", blob);
      showBg(blob);
      showToast("背景にしました");
    } catch { showToast("この画像は使えませんでした。別の画像を試してください"); }
  });
  $("bg-clear").addEventListener("click", async () => {
    let old = null;
    try { old = await idb.get("bg"); await idb.del("bg"); } catch {}
    showBg(null);
    showToast("背景を外しました", old ? async () => { try { await idb.set("bg", old); showBg(old); } catch {} } : null);
  });

  const veil = $("veil"), veilOut = $("veil-out");
  const showVeil = () => { veil.value = style.veil; veilOut.textContent = Math.round(style.veil * 100) + "%"; };
  veil.addEventListener("input", () => { style.veil = +veil.value; applyStyle(); showVeil(); });
  veil.addEventListener("change", saveStyle);

  $("reset-style").addEventListener("click", async () => {
    const before = { ...style };
    style = { ...STYLE_DEFAULTS }; applyStyle(); saveStyle();
    renderSwatches(); renderFonts(); showVeil();
    showToast("色とフォントを戻しました", () => { style = before; applyStyle(); saveStyle(); renderSwatches(); renderFonts(); showVeil(); });
  });

  // =====================================================================
  // tabs
  // =====================================================================
  const TABS = { dates: $("tab-dates"), shop: $("tab-shop"), style: $("tab-style") };
  const K_TAB = "hizuke-memo:tab";
  function showTab(name) {
    if (!TABS[name]) name = "dates";
    for (const [k, el] of Object.entries(TABS)) el.hidden = k !== name;
    document.querySelectorAll("nav.tabs button").forEach(b => {
      if (b.dataset.tab === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    try { localStorage.setItem(K_TAB, name); } catch {}
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

  // keep other open windows of the app in step
  window.addEventListener("storage", e => {
    if (e.key === K_DATES) { items = load(K_DATES, []); if (!editingId) renderDates(); }
    if (e.key === K_SHOP) { shop = load(K_SHOP, []); if (!shopEditing) renderShop(); }
  });

  // redraw when the day changes so 今日/明日 stay right
  let lastDay = key(today0());
  setInterval(() => {
    const k = key(today0());
    if (k === lastDay) return;
    lastDay = k; setTodayline(); renderDates();
  }, 60000);

  // ---------- start ----------
  applyStyle();
  setTodayline();
  renderDates();
  updatePreview();
  renderShop();
  renderSwatches();
  renderFonts();
  showVeil();
  let lastTab = "dates";
  try { lastTab = localStorage.getItem(K_TAB) || "dates"; } catch {}
  showTab(lastTab);
  idb.get("bg").then(b => { if (b) showBg(b); }).catch(() => {});
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
</script>
</body>
</html>
